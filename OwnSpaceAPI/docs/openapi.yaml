openapi: 3.0.3
info:
  title: OwnSpaceAPI
  description: >
    Backend de MyOwnSpace. Contrato de diseño (el "mockup" del backend) —
    ver ../SPEC.md. Una vez implementado, el Swagger generado por el código
    es la fuente de verdad de lo que realmente corre; este archivo es la
    fuente de verdad de diseño y debe mantenerse alineado a mano.
  version: "0.1.0"
servers:
  - url: https://localhost:7000/api/v1
    description: Desarrollo local

tags:
  - name: auth
  - name: users
  - name: requests
  - name: pto

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Inicia sesión. Setea la cookie httpOnly `accessToken` (JWT).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=<jwt>; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: >
            Credenciales inválidas o usuario Desactivado. Mismo mensaje
            genérico en ambos casos — nunca confirmar si el correo existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/logout:
    post:
      tags: [auth]
      summary: Cierra sesión. Borra la cookie `accessToken`.
      responses:
        '204':
          description: Sesión cerrada.

  /auth/session:
    get:
      tags: [auth]
      summary: >
        Valida la cookie actual y, si es válida, renueva su expiración
        (+2h desde ahora — expiración deslizante por inactividad, no fija).
        Equivale a refresh-session.ts del frontend.
      responses:
        '200':
          description: Sesión válida (renovada).
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Sin cookie, cookie inválida, o expirada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: >
        Emite una contraseña temporal y la envía por correo. Siempre
        responde 200, exista o no el correo — nunca revela si un correo
        está registrado. Si existe (y no está Desactivado), el usuario
        queda Activo, con la temporal como su contraseña real y
        mustChangePassword=true: puede loguearse de inmediato con ella,
        pero solo puede llamar a /auth/change-password, /auth/logout o
        /auth/session hasta que la cambie (ver el middleware de
        Program.cs).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Solicitud aceptada (independientemente de si el correo existe).

  /users:
    get:
      tags: [users]
      summary: Lista todos los usuarios.
      security: [{ cookieAuth: [Administrador] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '404':
          description: Rol insuficiente (nunca 401/403 — ver SPEC.md §9).
    post:
      tags: [users]
      summary: Crea un usuario. Queda en estado Pendiente; dispara la invitación por correo.
      security: [{ cookieAuth: [Administrador] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Ya existe un usuario con ese correo (comparación case-insensitive).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /users/{id}:
    patch:
      tags: [users]
      summary: Edita nombre/correo/rol de un usuario existente.
      security: [{ cookieAuth: [Administrador] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Usuario no encontrado, o rol insuficiente.
        '409':
          description: El nuevo correo ya pertenece a otro usuario.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /users/{id}/reset-password:
    post:
      tags: [users]
      summary: >
        Un admin fuerza el reseteo de la contraseña de otro usuario (o la
        propia): emite una temporal nueva y la envía por correo — mismo
        mecanismo y el mismo efecto que /auth/forgot-password.
      security: [{ cookieAuth: [Administrador] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Reseteo iniciado.
        '404':
          description: Usuario no encontrado, o rol insuficiente.

  /users/{id}/toggle-status:
    post:
      tags: [users]
      summary: Alterna entre Activo y Desactivado. No aplica a usuarios Pendientes.
      security: [{ cookieAuth: [Administrador] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Usuario no encontrado, o rol insuficiente.
        '409':
          description: El usuario está en estado Pendiente (no tiene Activo/Desactivado que alternar).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /requests/mine:
    get:
      tags: [requests]
      summary: Lista las solicitudes del empleado autenticado.
      security: [{ cookieAuth: [Empleado] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRequest'

  /requests/pending:
    get:
      tags: [requests]
      summary: >
        Lista todas las solicitudes pendientes (sin jerarquía
        jefe-empleado — ver SPEC.md §8), paginado y ordenado por
        CreatedAt ascendente (la más vieja primero).
      security: [{ cookieAuth: [Administrador] }]
      parameters:
        - $ref: '#/components/parameters/RequestsTipoFiltro'
        - $ref: '#/components/parameters/RequestsFechaFiltro'
        - $ref: '#/components/parameters/RequestsNombreFiltro'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedLeaveRequests'

  /requests:
    get:
      tags: [requests]
      summary: >
        Lista solicitudes, paginado y ordenado por CreatedAt descendente
        (la más nueva primero).
      security: [{ cookieAuth: [Administrador] }]
      parameters:
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/RequestStatus' }
        - $ref: '#/components/parameters/RequestsTipoFiltro'
        - $ref: '#/components/parameters/RequestsFechaFiltro'
        - $ref: '#/components/parameters/RequestsNombreFiltro'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedLeaveRequests'
    post:
      tags: [requests]
      summary: >
        Crea una solicitud propia. Queda en estado Pendiente. No acepta
        Tipo=Vacaciones — ese tipo tiene su propio flujo de autoservicio,
        ver /pto/requests.
      security: [{ cookieAuth: [Empleado] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeaveRequestRequest'
      responses:
        '201':
          description: Solicitud creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '400':
          description: fechaFin anterior a fechaInicio, Tipo=Vacaciones, u otro dato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'

  /requests/{id}/approve:
    post:
      tags: [requests]
      summary: Aprueba una solicitud pendiente. Dispara correo al empleado.
      security: [{ cookieAuth: [Administrador] }]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Solicitud aprobada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '404':
          description: Solicitud no encontrada, o rol insuficiente.
        '409':
          description: La solicitud ya no está Pendiente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /requests/{id}/deny:
    post:
      tags: [requests]
      summary: Deniega una solicitud pendiente. Dispara correo al empleado.
      security: [{ cookieAuth: [Administrador] }]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Solicitud denegada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '404':
          description: Solicitud no encontrada, o rol insuficiente.
        '409':
          description: La solicitud ya no está Pendiente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /pto/balance:
    get:
      tags: [pto]
      summary: >
        Balance de PTO disponible del empleado autenticado. Calculado al
        vuelo (sin persistencia propia) a partir de FechaIngreso/
        FechaDesactivacion — devengo de 5h por quincena, recortado al año
        en curso (política "use it or lose it").
      security: [{ cookieAuth: [Empleado] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PtoBalance'

  /pto/requests:
    post:
      tags: [pto]
      summary: >
        Reserva PTO para una fecha (autoservicio, sin motivo ni
        aprobación de un admin — distinto del flujo genérico de
        /requests). Nace directo en estado Aprobada, con Tipo=Vacaciones.
      security: [{ cookieAuth: [Empleado] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePtoRequestRequest'
      responses:
        '201':
          description: PTO reservado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '400':
          description: Horas fuera de rango (0, 8].
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Ya hay una reserva Aprobada para esa fecha, o el balance disponible no alcanza.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /pto/calendario:
    get:
      tags: [pto]
      summary: >
        Listado de solo lectura de todas las reservas de PTO (Vacaciones
        Aprobada) del equipo, para planificación — no requiere ninguna
        acción de aprobar/denegar.
      security: [{ cookieAuth: [Administrador] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRequest'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: >
        JWT en cookie httpOnly/Secure. El array de scopes en cada uso de
        `security` documenta el/los rol(es) permitido(s) — no es OAuth2
        real, es notación para dejar el requisito de rol explícito en el
        contrato. Un rol insuficiente responde 404, no 401/403.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestsTipoFiltro:
      name: tipo
      in: query
      schema: { $ref: '#/components/schemas/RequestType' }
    RequestsFechaFiltro:
      name: fecha
      in: query
      description: Coincide si esta fecha cae dentro del rango [fechaInicio, fechaFin] de la solicitud.
      schema: { type: string, format: date }
    RequestsNombreFiltro:
      name: nombre
      in: query
      description: Búsqueda parcial sobre el nombre del empleado, sin distinguir mayúsculas.
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Máximo 100 (se acota del lado del servidor).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    UserRole:
      type: string
      enum: [Empleado, Administrador]

    UserStatus:
      type: string
      enum: [Pendiente, Activo, Desactivado]

    RequestType:
      type: string
      enum: [Emergencia, Enfermedad, "Permiso personal", Vacaciones, Otro]

    RequestStatus:
      type: string
      enum: [Pendiente, Aprobada, Denegada]

    PagedLeaveRequests:
      type: object
      required: [items, totalCount, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LeaveRequest' }
        totalCount:
          type: integer
          description: Total de solicitudes que matchean los filtros aplicados (no el total sin filtrar).
        page: { type: integer }
        pageSize: { type: integer }

    User:
      type: object
      required: [id, nombre, correo, rol, estado, fechaIngreso]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, maxLength: 200 }
        correo: { type: string, format: email, maxLength: 256 }
        rol: { $ref: '#/components/schemas/UserRole' }
        estado: { $ref: '#/components/schemas/UserStatus' }
        fechaIngreso:
          type: string
          format: date
          description: >
            Cargada por el admin al dar de alta — punto de partida del
            devengo de PTO de esta persona (ver /pto/balance).

    Session:
      type: object
      required: [userId, nombre, rol, estado, mustChangePassword]
      properties:
        userId: { type: string, format: uuid }
        nombre: { type: string }
        rol: { $ref: '#/components/schemas/UserRole' }
        estado: { $ref: '#/components/schemas/UserStatus' }
        mustChangePassword:
          type: boolean
          description: >
            true mientras la contraseña actual sea una temporal sin
            cambiar (invitación, forgot-password, o reset de admin). Con
            esto en true, el backend solo permite llamar a
            /auth/change-password, /auth/logout y /auth/session — el resto
            de /api responde 403.

    LeaveRequest:
      type: object
      required: [id, employeeId, tipo, fechaInicio, fechaFin, motivo, estado, createdAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeNombre:
          type: string
          nullable: true
          description: >
            Nombre del empleado. Null solo en la respuesta de POST
            /requests (crear no carga el User completo) — en todos los
            listados (mine/pending/all) siempre viene cargado.
        tipo: { $ref: '#/components/schemas/RequestType' }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        horaInicio: { type: string, pattern: '^\d{2}:\d{2}$', nullable: true, description: "Formato HH:mm. Van junto con horaFin o ninguna — una solicitud sin hora es de día completo." }
        horaFin: { type: string, pattern: '^\d{2}:\d{2}$', nullable: true }
        horasSolicitadas:
          type: number
          format: decimal
          nullable: true
          description: >
            Solo aplica a Tipo=Vacaciones (módulo de PTO, ver
            /pto/requests): 8 (jornada completa) o el valor
            personalizado. Null para el resto de los tipos.
        motivo: { type: string, maxLength: 1000 }
        estado: { $ref: '#/components/schemas/RequestStatus' }
        createdAt: { type: string, format: date-time }
        reviewedBy: { type: string, format: uuid, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }

    LoginRequest:
      type: object
      required: [correo, password]
      properties:
        correo: { type: string, format: email }
        password: { type: string, format: password }

    ForgotPasswordRequest:
      type: object
      required: [correo]
      properties:
        correo: { type: string, format: email }


    CreateUserRequest:
      type: object
      required: [nombre, correo, rol, fechaIngreso]
      properties:
        nombre: { type: string, maxLength: 200 }
        correo: { type: string, format: email, maxLength: 256 }
        rol: { $ref: '#/components/schemas/UserRole' }
        fechaIngreso: { type: string, format: date }

    UpdateUserRequest:
      type: object
      properties:
        nombre: { type: string, maxLength: 200 }
        correo: { type: string, format: email, maxLength: 256 }
        rol: { $ref: '#/components/schemas/UserRole' }

    CreateLeaveRequestRequest:
      type: object
      required: [tipo, fechaInicio, fechaFin, motivo]
      properties:
        tipo:
          allOf: [{ $ref: '#/components/schemas/RequestType' }]
          enum: [Emergencia, Enfermedad, "Permiso personal", Otro]
          description: Vacaciones no es válido acá — usar /pto/requests.
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        horaInicio: { type: string, pattern: '^\d{2}:\d{2}$', nullable: true, description: "Formato HH:mm, opcional. Van junto con horaFin o ninguna." }
        horaFin: { type: string, pattern: '^\d{2}:\d{2}$', nullable: true }
        motivo: { type: string, maxLength: 1000 }

    PtoBalance:
      type: object
      required: [horasDisponibles]
      properties:
        horasDisponibles:
          type: number
          format: decimal
          description: Nunca negativo — recortado a 0 como piso defensivo.

    CreatePtoRequestRequest:
      type: object
      required: [fecha, horas]
      properties:
        fecha: { type: string, format: date }
        horas:
          type: number
          format: decimal
          description: Mayor a 0 y hasta 8 (jornada completa) por fecha.

    ProblemDetails:
      type: object
      description: RFC 7807 — formato estándar de error de ASP.NET Core.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
